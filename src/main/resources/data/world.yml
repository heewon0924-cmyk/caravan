# 세계 설정 — docs/03-이동과-시간.md 2·3장
#
# speed : 시간 배율. 현실 1분이 세계 몇 분인가
#         60 = 개발·검증 (2시간 노선이 2분)
#          6 = 프로토타입 플레이테스트 (2시간 노선이 20분)   ← 기본값
#          1 = 정식 검토
#
#         배율을 바꿔도 밸런스는 그대로다. 생산·소비·이동이 전부 세계 시간
#         기준이라 배율에 비례한다. 코드와 데이터의 모든 시간은 세계 시간으로만 적는다.
#
# granaryCapMultiple : 재고가 기준재고의 이 배수를 넘으면 초과분이 상한다
# spoilRatePerTick   : 넘친 초과분이 매 틱 상하는 비율

world:
  speed: 6.0
  granaryCapMultiple: 3.0
  spoilRatePerTick: 0.05

  # 가격 상하한 — 기준가의 배수 (docs/02-교역과-가격.md 2장)
  priceFloorMultiple: 0.35
  priceCeilingMultiple: 3.0

  # 거래세. 사고팔 때 각각 물린다 → 왕복하면 약 6%가 날아간다.
  # 이 값이 "움직일 가치가 있는 차익"의 하한선을 만든다 (docs/02 6장).
  # 적분 가격만으로는 사서 곧바로 되팔면 정확히 본전이라, 거래세를 빼면
  # 왕복이 공짜가 된다.
  tradeTaxRate: 0.03

  # 상단의 시작 자본 (docs/10-성장과-목표.md 1장 — 개인 상인 단계)
  # 캐러밴 용량 60 에 밀 부피가 1.0 이라 한 캐러밴이 약 6,200 G 다 —
  # 첫 캐러밴을 꽉 채우고 3,800 G 가 남는다 (docs/22 3장).
  startingGold: 10000

  # 캐러밴 (docs/05-캐러밴.md 4장, docs/03-이동과-시간.md 5장)
  # capacity      : 실을 수 있는 총 부피
  # loadSlowdown  : 가득 실었을 때 느려지는 비율 (0.4 = 40% 더 걸린다)
  # travelCostPerHour : 노선 기본 소요시간 1시간당 출발비
  caravanCapacity: 60
  loadSlowdown: 0.4
  travelCostPerHour: 30

  # NPC 상인 (docs/09-이벤트와-NPC.md 2장)
  # 플레이어보다 작게 움직여야 한다 — 차익을 전부 먹어치우면 플레이어가 할 일이 없다.
  npcCaravanCapacity: 40
  npcStartingGold: 40000

  # NPC 성격. 같은 시세를 봐도 다르게 판단한다.
  #
  # minMargin 이 이 게임 밸런스에서 가장 민감한 숫자다. NPC 는 추정 마진이 이 값
  # 아래로 떨어지면 그만두므로, **이 값이 곧 도시 간 잔여 가격차의 바닥이고
  # 그게 곧 플레이어의 수익률**이 된다. 4단계에서 재보니:
  #
  #     0.18/0.10/0.04 → 왕복 중앙값 +106%
  #     0.08/0.04/0.015 → +25%
  #     0.05/0.025/0.01 → +13%
  #     0.04/0.02/0.005 → +11%   ← 목표(5~15%) 한가운데
  #
  # 값이 작아 보이는 것은 NPC 의 추정이 보수적이기 때문이다(기억은 묵었고
  # 판매가는 깎아서 잡는다). 실제로 실현되는 마진은 이보다 높다.
  #
  # count 합계가 NPC 인원이다. 몇 명이 필요한지는 세계가 하루에 얼마나 날라야
  # 하는지로 정해진다 — 필요 운송량이 하루 약 890 부피이고 한 명이 하루에 나르는
  # 양이 약 120 부피라 8명이 최소치다. 놀거나 잘못 고르는 몫까지 감안해 14명.
  npcTemperaments:
    - name: 소심
      count: 4
      minMargin: 0.04      # 확실한 차익만
      maxDanger: 0.06      # 안전 노선만
      bite: 0.15           # 한 시장의 15%까지만 사들인다
    - name: 보통
      count: 7
      minMargin: 0.02
      maxDanger: 0.15
      bite: 0.22
    - name: 과감
      count: 3
      minMargin: 0.005     # 얇은 차익도 문다
      maxDanger: 1.00      # 위험 노선도 간다
      bite: 0.30

  # 정보 (docs/04-정보.md 4장)
  #
  # 정보상에게 한 번 묻는 값. 주점은 방문당 한 번 공짜다.
  #
  # 원래 제안은 200~800 G 였는데, 그건 경제를 재보기 전에 적은 값이다. 5단계에서
  # 재보니 소문 한 조각의 값어치가 약 65 G 였다 — 왕복 한 번 이익이 600 G 인
  # 세계에서 정보 하나에 200 G 를 받으면 사는 쪽이 손해다.
  #
  # 100 도 확정이 아니다. 정액 수수료는 자본이 100배로 커지는 게임에서 어차피
  # 오래 못 간다 — 자본이나 정보의 값어치에 비례하는 쪽이 맞을 것이다. [미결]
  informantFee: 100

  # 이벤트 (docs/09 3장)
  # 너무 잦으면 세계가 시끄러워서 아무것도 못 읽고, 너무 드물면 평형에 빠진다.
  eventsPerDay: 0.8
  maxConcurrentEvents: 2
