# 도시와 시장 — docs/01-세계와-도시.md 4장, docs/02-교역과-가격.md 4장
#
# refStock         : 기준재고. 재고가 이 값이면 시세가 정확히 기준가다
# productionPerDay : 세계시간 하루당 생산량
# consumptionPerDay: 세계시간 하루당 소비량
# initialStock     : 생략하면 refStock 으로 시작한다
#
# 세 도시 모두 혼자서는 굶는다. 하른은 밀만 남고 철이 없고, 카르덴은 철만 남고
# 밀이 없다. 누군가 실어 나르지 않으면 셋 다 망한다 — 그게 플레이어가 있어야 할 이유다.
#
# 다만 **세계 전체로는 모든 품목이 남아야 한다.** 세계 생산이 세계 소비보다 적으면
# 누가 아무리 잘 날라도 어느 도시는 반드시 굶는다. 그건 교역으로 풀 수 있는 문제가
# 아니라 데이터가 틀린 것이다 — WorldBalanceTest 가 매 빌드마다 검사한다.
# (4단계에서 밀 -80/일, 소금 -50/일 로 깨져 있는 걸 발견해서 고쳤다. docs/24 2장)

cities:
  - id: harn
    name: 하른
    trait: 평야 · 밀밭. 가장 안전하고 가장 심심하다. 수련처가 없다.
    # training 이 비어 있으면 전직할 수 없다. 시작 도시에 수련처가 없는 것은
    # 의도적이다 — 첫 전직을 하려면 반드시 한 번은 떠나야 한다 (docs/01 4.1).
    training: {}
    market:
      - goods: wheat
        refStock: 2000
        productionPerDay: 900
        consumptionPerDay: 240
      - goods: iron
        refStock: 200
        productionPerDay: 0
        consumptionPerDay: 60
      - goods: salt
        refStock: 250
        productionPerDay: 0
        consumptionPerDay: 80
      - goods: cloth
        refStock: 120
        productionPerDay: 0
        consumptionPerDay: 30
      - goods: spice
        refStock: 30
        productionPerDay: 0
        consumptionPerDay: 6

  - id: karden
    name: 카르덴
    trait: 산기슭 · 광산. 철이 싸고 밀이 비싸다. 창 · 중장 계열 전직에 유리.
    # 대장간과 광산 경비대가 있다
    training:
      중장: 3.0
      범용: 1.5
    market:
      - goods: wheat
        refStock: 600
        productionPerDay: 0
        consumptionPerDay: 300
      - goods: iron
        refStock: 900
        productionPerDay: 190
        consumptionPerDay: 40
      - goods: salt
        refStock: 200
        productionPerDay: 0
        consumptionPerDay: 90
      - goods: cloth
        refStock: 120
        productionPerDay: 0
        consumptionPerDay: 40
      - goods: spice
        refStock: 30
        productionPerDay: 0
        consumptionPerDay: 8

  - id: selia
    name: 셀리아
    trait: 항구. 가격 변동이 가장 크다. 해양 계열 전직에 유리.
    # 선원과 밀수꾼이 드나든다
    training:
      해양: 3.0
      정보: 2.0
      상인: 1.5
    market:
      - goods: wheat
        refStock: 700
        productionPerDay: 0
        consumptionPerDay: 260
      - goods: iron
        refStock: 250
        productionPerDay: 0
        consumptionPerDay: 70
      - goods: salt
        refStock: 600
        productionPerDay: 258
        consumptionPerDay: 60
      - goods: cloth
        refStock: 500
        productionPerDay: 134
        consumptionPerDay: 50
      - goods: spice
        refStock: 300
        productionPerDay: 30
        consumptionPerDay: 10
