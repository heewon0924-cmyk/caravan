# 도시와 시장 — docs/01-세계와-도시.md 4장, docs/02-교역과-가격.md 4장
#
# refStock         : 기준재고. 재고가 이 값이면 시세가 정확히 기준가다
# productionPerDay : 세계시간 하루당 생산량
# consumptionPerDay: 세계시간 하루당 소비량
# initialStock     : 생략하면 refStock 으로 시작한다
#
# 세 도시 모두 혼자서는 굶는다. 하른은 밀만 남고 철이 없고, 카르덴은 철만 남고
# 밀이 없다. 누군가 실어 나르지 않으면 셋 다 망한다 — 그게 플레이어가 있어야 할 이유다.

